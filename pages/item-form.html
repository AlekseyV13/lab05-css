<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додати новий курс | Адмінка</title>
    <link rel="stylesheet" href="../styles/style.css">
    
    <script src="../js/main.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/form.js" defer></script> </head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>Адміністративна панель</h1>
            <nav>
                <ul class="nav-list">
                    <li><a href="../index.html">Головна</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="item-form.html" class="active">Додати курс</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container section">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h2>Створити новий запис</h2>
            
            <form id="crud-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <div class="form-group">
                    <label>Назва курсу/проєкту:</label>
                    <input type="text" name="title" required minlength="3" placeholder="Введіть назву">
                </div>

                <div class="form-group">
                    <label>Категорія:</label>
                    <select name="category" required>
                        <option value="frontend">Frontend</option>
                        <option value="python">Python</option>
                        <option value="data">Data Science</option>
                        <option value="hobby">Хобі</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ціна (грн):</label>
                    <input type="number" name="price" required min="1" placeholder="Наприклад: 500">
                </div>

                <div class="form-group">
                    <label>Рейтинг (від 1 до 5):</label>
                    <input type="number" name="rating" required min="1" max="5" step="0.1" placeholder="Наприклад: 4.5">
                </div>

                <div class="form-group">
                    <label>URL картинки (опційно):</label>
                    <input type="url" name="image" placeholder="https://picsum.photos/id/10/300/200" value="https://picsum.photos/id/10/300/200">
                </div>

                <div class="form-group">
                    <label>Опис:</label>
                    <textarea name="description" required rows="4" placeholder="Короткий опис..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">Зберегти в базу</button>
            </form>

            <div id="success-message" hidden style="margin-top: 20px; padding: 15px; background: #d4edda; color: #155724; border-radius: 5px;">
                ✅ Новий курс успішно додано! <a href="catalog.html">Перейти до каталогу</a>
            </div>
        </div>
    </main>
</body>
</html>
